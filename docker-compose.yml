# Hand-built stack, one command: `docker compose up --build`
#   API on http://localhost:3000, two workers, Postgres, and the fake payment/document/policy services.
# Temporal stack as well: `docker compose --profile temporal up --build`
#   adds the Temporal dev server (gRPC :7233, Web UI http://localhost:8233), its API on
#   http://localhost:3100 and two Temporal workers. Both stacks share the fakes.
name: policy-workflow

x-app: &app
  image: durable-policy-workflow:local
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    fakes:
      condition: service_started
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://localhost:3000/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
    interval: 3s
    timeout: 3s
    retries: 20

x-app-env: &app-env
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/policy_workflow
  PAYMENT_PROVIDER_URL: http://fakes:4001
  DOCUMENT_SERVICE_URL: http://fakes:4002
  PAYMENT_CALLBACK_URL: http://api:3000/webhooks/payments
  LOG_LEVEL: info
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # local development only
      POSTGRES_DB: policy_workflow
    # Override with POSTGRES_PORT if you already run Postgres locally.
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d policy_workflow"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Builds the shared image; the other services reuse it.
  fakes:
    build: .
    image: durable-policy-workflow:local
    command: ["node", "packages/domain/dist/src/fakes/main.js"]
    environment:
      # Example: FAKE_PAYMENT_FAULTS='{"responseDelayMs":3000}' docker compose up
      FAKE_PAYMENT_FAULTS: ${FAKE_PAYMENT_FAULTS:-}
      FAKE_DOCUMENT_FAULTS: ${FAKE_DOCUMENT_FAULTS:-}
      FAKE_POLICY_FAULTS: ${FAKE_POLICY_FAULTS:-}
    ports: ["4001:4001", "4002:4002", "4003:4003"]

  # ---- Temporal implementation (opt in: `docker compose --profile temporal up`) ----
  temporal:
    profiles: ["temporal"]
    image: temporalio/temporal:1.10.0
    # Temporal CLI dev server: in-memory persistence, single process, Web UI on :8233.
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-port", "8233", "--log-level", "warn"]
    ports: ["${TEMPORAL_PORT:-7233}:7233", "${TEMPORAL_UI_PORT:-8233}:8233"]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 2s
      timeout: 5s
      retries: 30

  temporal-api:
    profiles: ["temporal"]
    build:
      context: .
      dockerfile: Dockerfile.temporal
    image: durable-policy-workflow-temporal:local
    command: ["node", "packages/temporal/dist/src/main-api.js"]
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment: &temporal-env
      TEMPORAL_ADDRESS: temporal:7233
      PORT: "3100"
      PAYMENT_PROVIDER_URL: http://fakes:4001
      DOCUMENT_SERVICE_URL: http://fakes:4002
      POLICY_REGISTRY_URL: http://fakes:4003
      PAYMENT_CALLBACK_URL: http://temporal-api:3100/webhooks/payments
      LOG_LEVEL: info
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports: ["3100:3100"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20

  temporal-worker:
    profiles: ["temporal"]
    image: durable-policy-workflow-temporal:local
    command: ["node", "packages/temporal/dist/src/main-worker.js"]
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
      temporal-api:
        condition: service_started
      fakes:
        condition: service_started
    environment: *temporal-env
    deploy:
      replicas: 2

  api:
    <<: *app
    environment:
      <<: *app-env
      ROLE: api
    ports: ["3000:3000"]

  worker:
    <<: *app
    environment:
      <<: *app-env
      ROLE: worker
    # Two workers compete for the same outbox: SKIP LOCKED + leases keep them honest.
    deploy:
      replicas: 2
