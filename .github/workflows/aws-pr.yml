name: AWS offline synth and diff
on:
  pull_request:
    paths:
      - 'infra/**'
      - 'packages/**'
      - 'scripts/aws/**'
      - 'package*.json'
      - '.github/workflows/aws*.yml'
permissions:
  contents: read
jobs:
  synth-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synthesize trusted base without AWS credentials
        shell: bash
        run: |
          set -euo pipefail
          if test -f trusted-base/infra/package.json; then
            cd trusted-base
            npm ci
            npm run aws:synth -- --quiet
            cp infra/cdk.out/PolicyDemo.template.json "$RUNNER_TEMP/base-template.json"
          else
            printf '%s\n' '{"AWSTemplateFormatVersion":"2010-09-09","Resources":{}}' > "$RUNNER_TEMP/base-template.json"
          fi
      - name: Validate candidate and compare offline templates
        working-directory: candidate
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
          CDK_DISABLE_VERSION_CHECK: '1'
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --test scripts/aws/common.test.mjs
          npm run test:infra
          npm run aws:synth -- --quiet
          AWS_DIFF_BASE_TEMPLATE="$RUNNER_TEMP/base-template.json" npm run aws:diff
      # No OIDC, AWS credentials, deploy, artifact execution, or pull_request_target.
