name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  handbuilt:
    name: Hand-built - integration, fault-injection and parity suites (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: policy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d policy_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/policy_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  temporal-time-skipping:
    name: Temporal - parity, workflow and replay suites (time-skipping test server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The SDK downloads Temporal's time-skipping test server on first use.
      - run: npm run test:temporal

  temporal-dev-server:
    name: Temporal - same suites against the dev server from docker compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEMPORAL_ADDRESS: localhost:7233
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: docker compose --profile temporal up -d --wait temporal
      - run: npm ci
      - run: npm run test:temporal
      - name: Temporal server logs on failure
        if: failure()
        run: docker compose --profile temporal logs temporal
      - run: docker compose --profile temporal down -v
        if: always()

  compose-smoke:
    name: docker compose up (both stacks) + smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: docker compose --profile temporal up --build -d --wait
      - name: Smoke test, hand-built API
        run: node scripts/smoke.mjs http://localhost:3000
      - name: Smoke test, Temporal API
        run: node scripts/smoke.mjs http://localhost:3100
      - name: Logs on failure
        if: failure()
        run: docker compose --profile temporal logs
      - run: docker compose --profile temporal down -v
        if: always()
